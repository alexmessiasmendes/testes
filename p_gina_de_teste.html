<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

    <main class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-xl border border-gray-100 dark:border-gray-700/60 text-center transition-all duration-300 hover:shadow-2xl">
        <!-- Minimalist Status Indicator -->
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-6 border border-indigo-100 dark:border-indigo-900/50">
            <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
            Modo de Teste
        </div>

        <!-- Main Title -->
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-3">
            Página de Teste
        </h1>

        <!-- Explanation Text -->
        <p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed">
            Esta página serve apenas para fins de teste e verificação de ambiente. Nenhum dado está sendo coletado ou exibido aqui.
        </p>

        <!-- Minimal Footer Note -->
        <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700/50 text-xs text-gray-400 dark:text-gray-500">
            Ambiente temporário • Fim de demonstração
        </div>
    </main>

</body>
</html>
